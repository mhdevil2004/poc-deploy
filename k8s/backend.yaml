apiVersion: v1
kind: ConfigMap
metadata:
  name: loan-backend-config
  labels:
    app.kubernetes.io/name: loan-backend
    app.kubernetes.io/part-of: loan-app
data:
  DB_HOST: postgres
  DB_PORT: "5432"
  PORT: "8080"
  # Replace with the URL(s) where your frontend is served. Comma-separated values are supported.
  CORS_ORIGINS: "http://localhost:3000"
  # Leave empty to use the application's default Gemini model.
  GEMINI_MODEL: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: loan-backend-secrets
  labels:
    app.kubernetes.io/name: loan-backend
    app.kubernetes.io/part-of: loan-app
type: Opaque
stringData:
  # Development-only values. Replace these before exposing the application.
  DB_NAME: loan_api
  DB_USER: postgres
  DB_PASSWORD: change-me-before-production
  JWT_SECRET: change-me-to-a-long-random-value
  # Optional: leave empty to disable the Gemini-powered agent endpoint.
  GEMINI_API_KEY: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loan-backend
  labels:
    app.kubernetes.io/name: loan-backend
    app.kubernetes.io/part-of: loan-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loan-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loan-backend
        app.kubernetes.io/part-of: loan-app
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: loan-backend-secrets
            - configMapRef:
                name: loan-backend-config
          command:
            - sh
            - -c
            - until pg_isready -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME"; do echo "waiting for postgres"; sleep 2; done
      containers:
        - name: loan-backend
          # Change this to the repository/tag pushed to your container registry.
          image: loan-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: loan-backend-config
            - secretRef:
                name: loan-backend-secrets
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: loan-backend
  labels:
    app.kubernetes.io/name: loan-backend
    app.kubernetes.io/part-of: loan-app
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: loan-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
